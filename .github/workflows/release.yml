name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build binary
        run: npm run build

      - name: Package release zip
        run: |
          cd build
          zip neuf-log-viewer.zip neuf-log-viewer.exe preset.json USERGUIDE.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/neuf-log-viewer.zip
          generate_release_notes: true
